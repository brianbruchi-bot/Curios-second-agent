name: Run YouTube Clipping Agent

concurrency:
  group: curious-second-agent
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi
      - name: Restore agent learning memory
        uses: actions/cache@v4
        with:
          path: .agent_state/
          key: curios-learning-${{ github.run_id }}
          restore-keys: |
            curios-learning-
      - name: Run agent
        run: python main.py
      - name: Save generated Short and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curios-short-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload to YouTube when explicitly enabled
        env:
          YOUTUBE_UPLOAD_ENABLED: ${{ secrets.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
        run: |
          if [ "$YOUTUBE_UPLOAD_ENABLED" = "true" ] && [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            python upload_youtube.py
          else
            echo "YouTube upload skipped: OAuth secret and explicit enable flag are not configured."
          fi
